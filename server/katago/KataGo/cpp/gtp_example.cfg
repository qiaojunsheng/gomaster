# KataGo GTP 默认配置
# 基本配置项

# 日志设置（必需）
logAllGTPCommunication = false
logAllGTPCommunicationToStderr = false
logSearchInfo = false
logToStderr = false

# 规则设置（必需）
koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButtons = false

# 搜索参数
# 注意：这些值会被 kata-set-param 命令覆盖
# 设置较小的默认值，确保时间控制生效
maxVisits = 50000
maxTime = 1.0
maxPlayouts = 2147483647
maxPlayoutsPolicy = 2147483647
maxTimePolicy = 2147483647

# 搜索线程数（必需）
numSearchThreads = 4

# 其他参数使用KataGo默认值
